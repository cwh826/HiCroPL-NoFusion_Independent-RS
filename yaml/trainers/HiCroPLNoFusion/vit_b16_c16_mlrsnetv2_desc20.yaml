# HiCroPL 删减版：移除两条跨模态映射和代理池化，保留提示、残差及蒸馏。
# RSICD 无原版 GPT 描述，明确使用固定遥感模板；不是原版精确消融复现。
DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 4
  TEST:
    BATCH_SIZE: 32
  NUM_WORKERS: 0

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "random_flip", "normalize"]

OPTIM:
  NAME: "adam"
  LR: 0.0025
  MAX_EPOCH: 50
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1e-5

TRAIN:
  PRINT_FREQ: 20

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  NAME: "HiCroPLNoFusion"
  HICROPL_NF:
    N_CTX: 16
    CTX_INIT: "a photo of a"
    PREC: "fp32"
    PROMPT_DEPTH: 12
    LAMBD: 12.0
    ADAM_EPS: 0.001
    TEXT_PROMPTS: "gpt_files/mlrsnetv2_prompt.json"
    TEMPLATES: ["a satellite image of {}.", "an aerial photograph of {}.", "a remote sensing image of {}."]
    TEACHER_BATCH_SIZE: 32

TEST:
  FINAL_MODEL: "best_val"
  SPLIT: "test"
